<title>Product Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#121212;
    --surface:#19191F;
    --surface-2:#202027;
    --border:#302F3B;
    --text:#F2F1F5;
    --text-muted:#A4A4AE;
    --text-faint:#6E6D7A;
    --main:#8377F7;
    --main-soft:#241F3D;
    --live:#63C2B4;
    --live-soft:#1D3733;
    --focus:#8377F7;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    padding-inline:20px; padding-block:28px 60px;
  }
  .wrap{ max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, "SF Mono", monospace; }
  .tabular{ font-variant-numeric: tabular-nums; }

  .back-link{
    align-self:flex-start; display:inline-flex; align-items:center; gap:6px;
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:500; letter-spacing:.01em;
    color:var(--text-faint); text-decoration:none;
  }
  .back-link:hover{ color:var(--main); }
  .back-link:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }

  header{ display:flex; flex-direction:column; gap:10px; }
  .eyebrow{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px; font-weight:600;
    letter-spacing:.11em; text-transform:uppercase; color:var(--main);
  }
  h1{ margin:0; font-size:clamp(26px,4.4vw,34px); font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
  .lede{ margin:0; color:var(--text-muted); font-size:14.5px; max-width:62ch; }

  .stat-strip{ display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:2px; }
  .stat{ display:flex; align-items:baseline; gap:6px; }
  .stat b{ font-family:"IBM Plex Mono",monospace; font-size:15px; color:var(--text); }
  .stat span{ font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }

  .grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }

  .group-empty{
    border:1px dashed var(--border); border-radius:14px; padding:22px 22px;
    color:var(--text-faint); font-size:13.5px; background:var(--surface);
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:999px; letter-spacing:.02em;
  }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .status-pill.live{ background:var(--live-soft); color:var(--live); }
  .status-pill.live .dot{ background:var(--live); }

  .project-card{
    position:relative; display:flex; flex-direction:column; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px 22px 22px; text-decoration:none; color:inherit;
    box-shadow:var(--shadow); transition:border-color .15s, transform .15s, background .15s;
  }
  a.project-card:hover{ border-color:var(--main); transform:translateY(-2px); background:var(--surface-2); }
  a.project-card:focus-visible{ outline:2px solid var(--main); outline-offset:2px; }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .arrow{ font-family:"IBM Plex Mono",monospace; font-size:16px; color:var(--text-faint); transition:transform .15s, color .15s; }
  a.project-card:hover .arrow{ color:var(--main); transform:translateX(3px); }
  .project-card h3{ margin:0; font-size:18px; font-weight:600; letter-spacing:-.005em; text-wrap:balance; }
  .project-card p{ margin:0; font-size:13.5px; line-height:1.55; color:var(--text-muted); }

  footer{ text-align:center; font-size:11.5px; color:var(--text-faint); }
</style>

<div class="wrap">

  <a class="back-link" href="hub.html">&larr; Home</a>

  <header>
    <div class="eyebrow">Onsor</div>
    <h1>Product Development</h1>
    <p class="lede">Engineering and product design work for upcoming Onsor devices.</p>
    <div class="stat-strip"><div class="stat"><b class="tabular">0</b><span>Not Started</span></div></div>
  </header>

  <div class="group-empty">No projects here yet. Ask to add one and it'll show up on this page and on Home.</div>

  <footer>Nothing here yet · ask to add a project and it will show up here and on Home.</footer>

</div>
