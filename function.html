<title>Onsor Function</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#121212;
    --surface:#19191F;
    --surface-2:#202027;
    --border:#302F3B;
    --text:#F2F1F5;
    --text-muted:#A4A4AE;
    --text-faint:#6E6D7A;
    --main:#8377F7;
    --main-soft:#241F3D;
    --live:#63C2B4;
    --live-soft:#1D3733;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    padding-inline:20px;
    padding-block:28px 60px;
  }
  .wrap{ max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:26px; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, "SF Mono", monospace; }

  .back-link{
    align-self:flex-start; display:inline-flex; align-items:center; gap:6px;
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:500; letter-spacing:.01em;
    color:var(--text-faint); text-decoration:none;
  }
  .back-link:hover{ color:var(--main); }
  .back-link:focus-visible{ outline:2px solid var(--main); outline-offset:2px; border-radius:4px; }

  header{ display:flex; flex-direction:column; gap:10px; }
  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
    color:var(--main);
  }
  h1{
    margin:0; font-size:clamp(26px,4.4vw,34px); font-weight:700; letter-spacing:-.01em;
    text-wrap:balance;
  }
  .lede{ margin:0; color:var(--text-muted); font-size:14.5px; max-width:60ch; }

  .grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

  .group-card{
    position:relative;
    display:flex; flex-direction:column; gap:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px 20px; text-decoration:none; color:inherit;
    box-shadow:var(--shadow);
    transition:border-color .15s, transform .15s, background .15s;
  }
  .group-card:hover{ border-color:var(--main); transform:translateY(-2px); background:var(--surface-2); }
  .group-card:focus-visible{ outline:2px solid var(--main); outline-offset:2px; }

  .card-top{ display:flex; align-items:center; justify-content:space-between; }

  .group-icon{
    flex:none; width:36px; height:36px; border-radius:10px;
    background:var(--main-soft); color:var(--main);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }

  .group-body{ display:flex; flex-direction:column; gap:3px; }
  .group-card h2{ margin:0; font-size:15.5px; font-weight:600; letter-spacing:-.005em; text-wrap:balance; }
  .group-meta{ font-size:12px; color:var(--text-faint); }
  .group-meta.has-projects{ color:var(--live); }

  .arrow{
    font-family:"IBM Plex Mono",monospace; font-size:16px; color:var(--text-faint);
    transition:transform .15s, color .15s;
  }
  .group-card:hover .arrow{ color:var(--main); transform:translateX(3px); }

  footer{ text-align:center; font-size:11.5px; color:var(--text-faint); }
</style>

<div class="wrap">

  <a class="back-link" href="hub.html">&larr; Home</a>

  <header>
    <div class="eyebrow">Onsor</div>
    <h1>Function</h1>
    <p class="lede">Everyday tools the team uses across products &mdash; pricing, investigations, and more as they're added.</p>
  </header>

  <div class="grid">

    <a class="group-card" href="device-pricing.html">
      <div class="card-top">
        <div class="group-icon">💰</div>
        <span class="arrow">&rarr;</span>
      </div>
      <div class="group-body">
        <h2>Device Pricing</h2>
        <div class="group-meta has-projects">Live · Notion</div>
      </div>
    </a>

    <a class="group-card" href="rca.html">
      <div class="card-top">
        <div class="group-icon">🕵️</div>
        <span class="arrow">&rarr;</span>
      </div>
      <div class="group-body">
        <h2>RCA</h2>
        <div class="group-meta has-projects">Live · Notion</div>
      </div>
    </a>

  </div>

  <footer>More functions get added here over time.</footer>

</div>
