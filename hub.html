<title>Onsor Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#121212;
    --surface:#19191F;
    --surface-2:#202027;
    --border:#302F3B;
    --text:#F2F1F5;
    --text-muted:#A4A4AE;
    --text-faint:#6E6D7A;
    --main:#8377F7;
    --main-soft:#241F3D;
    --live:#63C2B4;
    --live-soft:#1D3733;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    padding-inline:20px;
    padding-block:28px 60px;
  }
  .wrap{ max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:26px; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, "SF Mono", monospace; }
  .tabular{ font-variant-numeric: tabular-nums; }

  header{ display:flex; flex-direction:column; gap:10px; }
  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
    color:var(--main);
  }
  h1{
    margin:0; font-size:clamp(26px,4.4vw,34px); font-weight:700; letter-spacing:-.01em;
    text-wrap:balance;
  }
  .lede{ margin:0; color:var(--text-muted); font-size:14.5px; max-width:60ch; }

  .btn-list{ display:flex; flex-direction:column; gap:12px; }

  .group-btn{
    display:flex; align-items:center; gap:16px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; text-decoration:none; color:inherit;
    box-shadow:var(--shadow);
    transition:border-color .15s, transform .15s, background .15s;
  }
  .group-btn:hover{ border-color:var(--main); transform:translateY(-2px); background:var(--surface-2); }
  .group-btn:focus-visible{ outline:2px solid var(--main); outline-offset:2px; }

  .group-icon{
    flex:none; width:44px; height:44px; border-radius:11px;
    background:var(--main-soft); color:var(--main);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }

  .group-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .group-btn h2{ margin:0; font-size:17px; font-weight:600; letter-spacing:-.005em; }
  .group-meta{ font-size:12px; color:var(--text-faint); }
  .group-meta.has-projects{ color:var(--live); }

  .arrow{
    font-family:"IBM Plex Mono",monospace; font-size:18px; color:var(--text-faint); flex:none;
    transition:transform .15s, color .15s;
  }
  .group-btn:hover .arrow{ color:var(--main); transform:translateX(3px); }

  footer{ text-align:center; font-size:11.5px; color:var(--text-faint); }
</style>

<div class="wrap">

  <header>
    <div class="eyebrow">Onsor</div>
    <h1>Home</h1>
    <p class="lede">Pick a team to see what they're running.</p>
  </header>

  <div class="btn-list">

    <a class="group-btn" href="group-project-management.html">
      <div class="group-icon">🗂️</div>
      <div class="group-body">
        <h2>Project Management</h2>
        <div class="group-meta has-projects">4 projects</div>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="group-btn" href="group-product-development.html">
      <div class="group-icon">🧪</div>
      <div class="group-body">
        <h2>Product Development</h2>
        <div class="group-meta">Not started</div>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="group-btn" href="group-production.html">
      <div class="group-icon">🏭</div>
      <div class="group-body">
        <h2>Production</h2>
        <div class="group-meta">Not started</div>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="group-btn" href="group-technical-support.html">
      <div class="group-icon">🎫</div>
      <div class="group-body">
        <h2>Technical Support</h2>
        <div class="group-meta has-projects">1 project</div>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="group-btn" href="group-incentives.html">
      <div class="group-icon">🚀</div>
      <div class="group-body">
        <h2>Initiatives</h2>
        <div class="group-meta">Not started</div>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

  </div>

  <footer>Click a team to see its projects.</footer>

</div>
